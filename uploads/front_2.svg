<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
    <defs>
      <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0f0c08;stop-opacity:1" />
      </linearGradient>
      <filter id="shadow">
        <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.6"/>
      </filter>
    </defs>
    <rect width="400" height="600" fill="url(#grad)" />
    <rect x="20" y="20" width="360" height="560" fill="none" stroke="#F3E5AB" stroke-width="2" stroke-opacity="0.3" rx="10"/>
    <rect x="30" y="30" width="340" height="540" fill="none" stroke="#F3E5AB" stroke-width="1" stroke-opacity="0.2" rx="8"/>
    
    <text x="200" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#F3E5AB" letter-spacing="4" opacity="0.6">SPECIAL COLLECTOR'S EDITION</text>
    <path d="M 140 100 L 260 100" stroke="#F3E5AB" stroke-width="1" opacity="0.4" />
    <polygon points="200,97 203,103 197,103" fill="#F3E5AB" opacity="0.6" />

    <g transform="translate(180, 120) scale(0.4)" filter="url(#shadow)" opacity="0.8">
      <path d="M 24 4 L 4 24 L 24 44 L 44 24 Z" fill="none" stroke="#F3E5AB" stroke-width="4"/>
      <path d="M 24 10 L 10 24 L 24 38 L 38 24 Z" fill="#F3E5AB"/>
    </g>

    <g filter="url(#shadow)">
      <tspan x="200" y="220" text-anchor="middle" font-weight="bold" font-family="'Playfair Display', 'Georgia', serif" fill="#F3E5AB" font-size="28">Harry Potter and</tspan>
<tspan x="200" y="265" text-anchor="middle" font-weight="bold" font-family="'Playfair Display', 'Georgia', serif" fill="#F3E5AB" font-size="28">the Chamber of</tspan>
<tspan x="200" y="310" text-anchor="middle" font-weight="bold" font-family="'Playfair Display', 'Georgia', serif" fill="#F3E5AB" font-size="28">Secrets</tspan>
    </g>
    
    <line x1="160" y1="420" x2="240" y2="420" stroke="#F3E5AB" stroke-width="1.5" opacity="0.5" />
    
    <text x="200" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" letter-spacing="2" filter="url(#shadow)">
      J.K. Rowling
    </text>

    <text x="200" y="540" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#F3E5AB" opacity="0.5" letter-spacing="1">BOOKSTORE POS EXCLUSIVE</text>
  </svg>